apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret   # <-- reference the secret created in secrets.yaml
      containers:
        - name: flask-backend
          image: reyvi123/qtree-be-image-aug28
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-backend-service
spec:
  type: NodePort
  selector:
    app: flask-backend
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30050
